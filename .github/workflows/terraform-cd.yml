name: "Terraform CD — Apply"

# Applies to staging automatically on merge to main.
# Applies to prod only after manual approval via GitHub Environment.
on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - ".github/workflows/terraform-cd.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, prod]
      dry_run:
        description: "Plan only — do not apply"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

# Never cancel an in-flight apply — let it finish to avoid partial state.
concurrency:
  group: tf-apply-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job: apply-staging
  # Auto-deploys on every merge to main.
  # Manual dispatch: runs when environment == staging.
  # ──────────────────────────────────────────────────────────────────────────
  apply-staging:
    name: "Apply — staging"
    runs-on: ubuntu-latest
    environment: staging
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-engine-infra
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="key=infraenginepolicies/staging/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_LOCK_TABLE }}" \
            -no-color

      - name: Terraform Plan
        run: |
          terraform plan -no-color \
            -var="environment=staging" \
            -var="create_network_resources=true" \
            -var="create_api_gateway=true" \
            -out=tfplan.binary

      - name: Terraform Apply
        if: github.event.inputs.dry_run != 'true'
        run: terraform apply -auto-approve -no-color tfplan.binary

      - name: Apply Summary
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "## ✅ Terraform Apply — infraenginepolicies / staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor**  | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ref**    | \`${{ github.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          terraform output -no-color >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────────────
  # Job: apply-prod
  # Requires staging to succeed first, then waits for GitHub Environment
  # approval (configure reviewers in Settings → Environments → prod).
  # ──────────────────────────────────────────────────────────────────────────
  apply-prod:
    name: "Apply — prod"
    runs-on: ubuntu-latest
    needs: apply-staging
    environment: prod     # ← manual approval gate lives here
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Configure AWS credentials (OIDC) — prod role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-engine-infra-prod
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET_PROD }}" \
            -backend-config="key=infraenginepolicies/prod/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_LOCK_TABLE_PROD }}" \
            -no-color

      - name: Terraform Plan
        run: |
          terraform plan -no-color \
            -var="environment=prod" \
            -var="create_network_resources=true" \
            -var="create_api_gateway=true" \
            -out=tfplan.binary

      - name: Terraform Apply
        if: github.event.inputs.dry_run != 'true'
        run: terraform apply -auto-approve -no-color tfplan.binary

      - name: Apply Summary
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "## ✅ Terraform Apply — infraenginepolicies / prod" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor**  | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          terraform output -no-color >> $GITHUB_STEP_SUMMARY
